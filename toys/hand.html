<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand Toy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6f1e7; --ink:#231c16; --muted:#7b6f62; --ok:#3f7d4e; }
  html,body { margin:0; height:100%; background:#1c1511; overflow:hidden; font-family:'IBM Plex Mono', ui-monospace, monospace; }
  canvas { display:block; cursor:crosshair; }
  #docket { position:fixed; top:18px; left:18px; width:236px; background:var(--paper); color:var(--ink);
    padding:14px 16px 12px; border-radius:2px; transform:rotate(-1.2deg); box-shadow:0 10px 30px rgba(0,0,0,.45);
    font-size:12px; line-height:1.55; }
  #docket::before { content:''; position:absolute; top:-6px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:#8c8c8c; box-shadow:0 1px 2px rgba(0,0,0,.5); }
  #docket h1 { font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:20px; margin:0 0 2px; letter-spacing:-.01em; }
  #docket .who { color:var(--muted); margin-bottom:8px; border-bottom:1px dashed #cfc5b6; padding-bottom:8px; }
  #docket .step.done { color:var(--ok); text-decoration:line-through; }
  #docket .step.warn { color:#b5562e; }
  #docket .clock { font-size:22px; font-weight:500; margin-top:8px; }
  #docket .runs { margin-top:8px; border-top:1px dashed #cfc5b6; padding-top:6px; color:var(--muted); font-size:11px; }
  #docket .runs b { color:var(--ink); font-weight:500; }
  #toast { position:fixed; left:50%; top:20%; transform:translate(-50%,0); font-family:'Fraunces', Georgia, serif; font-size:28px;
    color:#fbf3e6; text-shadow:0 2px 18px rgba(0,0,0,.8); pointer-events:none; opacity:0; transition:opacity .25s; text-align:center; white-space:nowrap; }
  #toast small { display:block; font-family:'IBM Plex Mono', monospace; font-size:13px; opacity:.85; margin-top:4px; }
  #fingers { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:flex-end; }
  #fingers .f { width:38px; height:44px; border-radius:19px 19px 8px 8px; border:1.5px solid rgba(246,241,231,.4);
    color:rgba(246,241,231,.8); font-size:12px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; box-sizing:border-box; background:rgba(20,14,10,.35); }
  #fingers .f.thumb { width:64px; height:30px; border-radius:15px; margin-right:6px; align-items:center; padding:0; }
  #fingers .f.curl { background:rgba(246,241,231,.3); color:#fff; }
  #fingers .f.on { background:#3f7d4e; border-color:#7fc08f; color:#fff; }
  #grip { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); color:#f6f1e7; font-size:12px; letter-spacing:.08em; text-transform:uppercase; text-shadow:0 1px 6px #000; }
  #help { position:fixed; left:18px; bottom:18px; color:#f6f1e7; font-size:12px; line-height:1.8; background:rgba(20,14,10,.55); padding:10px 12px; border-radius:8px; backdrop-filter:blur(4px); }
  #help b { font-family:'Fraunces',serif; font-size:13px; display:block; margin-bottom:2px; }
  #cue { position:fixed; pointer-events:none; color:#fff; font-size:12px; background:rgba(20,14,10,.72); padding:4px 8px; border-radius:6px; white-space:nowrap; transform:translate(16px, 14px); opacity:0; transition:opacity .15s; }
  #coach { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); color:#231c16; background:#f6f1e7; font-size:13px; padding:7px 14px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.35); max-width:80vw; text-align:center; }
  #coach:empty { display:none; }
  #retry { position:fixed; top:18px; left:270px; font:500 12px 'IBM Plex Mono', monospace; color:#231c16; background:#f6f1e7; border:0; border-radius:6px; padding:8px 10px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #retry:hover { background:#fff; }
  #help kbd { font-family:inherit; border:1px solid rgba(246,241,231,.4); border-radius:3px; padding:0 4px; color:#fff; }
  #credits { position:fixed; right:12px; bottom:8px; color:rgba(246,241,231,.45); font-size:10px; }
  #credits a { color:inherit; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:#f6f1e7; font-family:'Fraunces',serif; font-size:22px; z-index:5; background:#1c1511; }
  @media (max-width: 760px) { #help, #credits { display:none; } #docket { transform:none; width:200px; } #retry { left:230px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>
<div id="loading">Warming the machine…</div>
<div id="docket"></div>
<div id="toast"></div>
<div id="grip"></div>
<div id="fingers"></div>
<div id="help"></div>
<div id="cue"></div>
<div id="coach"></div>
<button id="retry" title="Restart this order (R)">↺ Restart order · R</button>
<div id="credits">Models CC-BY: Lanzaman, JoeDev, DavidFischer, clon6767, Subdivision Productions, symbol aughhhh · <a href="../CREDITS.md">credits</a></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm';

const V3 = THREE.Vector3, QT = THREE.Quaternion;
const ASSETS = {
  hdri: 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/comfy_cafe_2k.hdr',
  oak: n => `https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/white_oak_veneer/white_oak_veneer_${n}_1k.jpg`,
  sf: n => `../assets/sketchfab/${n}/scene.gltf`,   // CC-BY models, see CREDITS.md
};

// ─────────────────────────────────────────────────────────────
// Feel parameters: the clumsiness dial.
// ─────────────────────────────────────────────────────────────
const DEFAULTS = {
  mode: 'easy',      // 'easy' = mouse only; 'fingers' = Surgeon-style key per finger; 'grip' = space closes all
  spring: 120, damping: 14, maxSpeed: 2.5,
  wristFollow: 12, rollSpeed: 2.2,
  hover: 0.36, lowerOffset: 0.09, carryLift: 0.012,
  curlSpeed: 9, grabRadius: 0.035,
  spillRate: 1.0, slosh: 1.0, trayTolerance: 0.035,
  bgBlur: 0.12, bgIntensity: 0.75, bgTurn: 1.57,
};
const P = { ...DEFAULTS };
try { const saved = JSON.parse(localStorage.getItem('handtoy.params.v4') || '{}'); for (const k in DEFAULTS) if (k in saved) P[k] = saved[k]; } catch {}
const save = () => { try { localStorage.setItem('handtoy.params.v4', JSON.stringify(P)); } catch {} };

// ─── layout (metres). The machine model is placed by measured geometry (tools/measure.html). ───
const BENCH = 0.9;
const M_OFF = new V3(0, BENCH + 0.034, -0.605);          // machine model origin in the world
const mY = y => M_OFF.y + y, mZ = z => M_OFF.z + z;
const TRAY_TOP = mY(0.133);                               // drip tray spans the whole front
const GROUP_BOTTOM = mY(0.339);
const MACHINE_FRONT = mZ(0.29), RECESS_BACK = mZ(0.084);
const GH = new V3(-0.15, 0, mZ(0.205));                   // left group head axis: the one we brew on
const PF_LOCK = new V3(GH.x, GROUP_BOTTOM - 0.0175, GH.z);
const PASS = new V3(-0.32, 0, 0.04);
const PASS_TOP = BENCH + 0.012;
const SPAWN = new V3(0.1, 0, -0.01);
// espresso chain stations (left of the machine)
const GRINDER = new V3(-0.6, BENCH, -0.52);
const FORK_POSE = new V3(GRINDER.x, BENCH + 0.2, GRINDER.z + 0.16);   // basket centre when docked under the chute
const CHUTE_Y = BENCH + 0.225;
const KNOCK = new V3(-0.62, BENCH, -0.2), KNOCK_R = 0.065, KNOCK_H = 0.1;
const TAMPER_HOME = new V3(-0.48, BENCH, -0.04);
const DOSE_G = 18.5;   // grams at dose = 1
// milk chain (right of the machine)
const JUG_HOME = new V3(0.29, BENCH, -0.17), BOTTLE_HOME = new V3(0.42, BENCH, -0.12);   // kept inside the view on narrow screens
const JUG_R = 0.041, JUG_H = 0.107, JUG_ML = 520;
const BOTTLE_H = 0.26, BOTTLE_R = 0.055, BOTTLE_ML = 2000;
const WAND_TOP = new V3(0.37, mY(0.335), mZ(0.13)), WAND_TIP = new V3(0.37, mY(0.215), mZ(0.33));
const SHOT_ML = 36, CUP_ML = 160;
const CUP_K = 1.35;                                       // cup-and-saucer model scale
const CUP_H = 0.044 * CUP_K, CUP_R = 0.035 * CUP_K, SAUCER_R = 0.045 * CUP_K, SAUCER_H = 0.010 * CUP_K;
const STEP = 1 / 60;
const GRAB_Z = -0.035;   // things are held under the fingers, ahead of the palm centre; the cursor aims this point
const UP = new V3(0, 1, 0);

// ─── renderer, scene, camera ───
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 1, 0.01, 40);
const CAM_POS = new V3(0.02, 1.52, 0.5), CAM_LOOK = new V3(-0.06, 1.04, -0.38);
camera.position.copy(CAM_POS); camera.lookAt(CAM_LOOK);
// the barista's shoulder steps along the bench with the hand; the camera stays put so the cursor and hand never drift apart
let bodyX = 0;
function fit() {
  camera.aspect = innerWidth / innerHeight;
  const minH = THREE.MathUtils.degToRad(80);   // wide enough that grinder (left) and milk (right) both stay in view
  camera.fov = Math.max(50, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(minH / 2) / camera.aspect)));
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();
const key = new THREE.DirectionalLight(0xffe6c8, 1.6);
key.position.set(-1.0, 3.0, 1.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.1, right: 1.1, top: 1.1, bottom: -1.1, near: 0.5, far: 6 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012;
scene.add(key);

// ─── load everything ───
const texLoader = new THREE.TextureLoader(), gltf = new GLTFLoader();
const loadTex = (url, srgb) => texLoader.loadAsync(url).then(t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; });
const [hdri, oakDiff, oakNor, oakRough, , gMachine, gCup, gArms, gPitcher, gTamper, gPaper] = await Promise.all([
  new RGBELoader().loadAsync(ASSETS.hdri),
  loadTex(ASSETS.oak('diff'), true), loadTex(ASSETS.oak('nor_gl')), loadTex(ASSETS.oak('rough')),
  RAPIER.init(),
  gltf.loadAsync(ASSETS.sf('canarian_cafe_-_coffee_machine')),
  gltf.loadAsync(ASSETS.sf('cup_of_coffee')),
  gltf.loadAsync(ASSETS.sf('first_person_hands_rigged')),
  gltf.loadAsync(ASSETS.sf('umamusume_milk_frothing_pitcher')),
  gltf.loadAsync(ASSETS.sf('coffee_tamper')),
  gltf.loadAsync(ASSETS.sf('paper_coffee_cup_3d_pack')),
]);
hdri.mapping = THREE.EquirectangularReflectionMapping;
scene.background = hdri; scene.environment = hdri;
function applyBg() {
  scene.backgroundBlurriness = P.bgBlur; scene.backgroundIntensity = P.bgIntensity;
  scene.backgroundRotation.set(0, P.bgTurn, 0); scene.environmentRotation.set(0, P.bgTurn, 0);
  scene.environmentIntensity = 0.9;
}
applyBg();
document.getElementById('loading').remove();

// ─── materials ───
function terrazzoTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#ebe6dd'; g.fillRect(0, 0, 1024, 1024);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#c7b6a2', '#8d918a', '#d48d68', '#3f3e3a', '#b9b2a6', '#e3a07f', '#6f7b72'];
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = cols[Math.floor(rnd() * cols.length)];
    const x = rnd() * 1024, y = rnd() * 1024, r = 1.2 + rnd() * (rnd() < 0.07 ? 11 : 4);
    g.beginPath();
    for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + rnd(); g.lineTo(x + Math.cos(a) * r * (0.6 + rnd() * 0.6), y + Math.sin(a) * r * (0.6 + rnd() * 0.6)); }
    g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1.6, 1.1); t.anisotropy = 8;
  return t;
}
const oak = (rx, ry) => {
  const m = new THREE.MeshStandardMaterial({ map: oakDiff.clone(), normalMap: oakNor.clone(), roughnessMap: oakRough.clone(), roughness: 1 });
  [m.map, m.normalMap, m.roughnessMap].forEach(t => { t.repeat.set(rx, ry); t.needsUpdate = true; });
  return m;
};
const M = {
  terrazzo: new THREE.MeshPhysicalMaterial({ map: terrazzoTexture(), roughness: 0.3, clearcoat: 0.5, clearcoatRoughness: 0.25 }),
  oakFront: oak(3, 1.5), oakBoard: oak(0.5, 0.4),
  brushed: new THREE.MeshStandardMaterial({ color: 0xbfc3c7, metalness: 1, roughness: 0.32 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xf2f3f4, metalness: 1, roughness: 0.06 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x3d4044, metalness: 1, roughness: 0.35 }),
  matte: new THREE.MeshStandardMaterial({ color: 0x18181a, roughness: 0.5 }),
  ceramic: new THREE.MeshPhysicalMaterial({ color: 0xf6f3ee, roughness: 0.2, clearcoat: 0.8, clearcoatRoughness: 0.12, side: THREE.DoubleSide }),
  skin: new THREE.MeshPhysicalMaterial({ color: 0xd7a084, roughness: 0.5, sheen: 0.5, sheenColor: new THREE.Color(0xff9f88), sheenRoughness: 0.5, clearcoat: 0.04 }),
  coffee: new THREE.MeshStandardMaterial({ color: 0x2e170b, roughness: 0.12 }),
  crema: new THREE.MeshStandardMaterial({ color: 0xa8652f, roughness: 0.3 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, transmission: 0.9, thickness: 0.01, transparent: true, opacity: 0.6 }),
  beans: new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.7 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xefe9df, roughness: 0.7 }),
};

// ─── physics world + helpers ───
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
world.timestep = STEP;
world.integrationParameters.numSolverIterations = 8;
const shadows = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
function add(mesh, x, y, z, parent = scene) { mesh.position.set(x, y, z); parent.add(shadows(mesh)); return mesh; }
function staticBox(hx, hy, hz, x, y, z) { world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z).setFriction(0.9)); }
function staticBoxSpan(x0, x1, y0, y1, z0, z1) { staticBox((x1 - x0) / 2, (y1 - y0) / 2, (z1 - z0) / 2, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); }
function staticCyl(r, h, x, y, z) { world.createCollider(RAPIER.ColliderDesc.cylinder(h / 2, r).setTranslation(x, y, z).setFriction(0.8)); }
function rodMesh(a, b, r, mat, seg = 16) {
  const d = b.clone().sub(a), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(UP, d.normalize());
  return shadows(m);
}
function lathe(pts, mat, seg = 48) { return shadows(new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg), mat)); }
// drop every triangle whose centre falls inside one of the boxes (model space): cuts baked-in parts out of a single-mesh model
function cullTriangles(root, boxes) {
  root.updateMatrixWorld(true);
  const a = new V3(), b = new V3(), c = new V3();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry, pos = g.attributes.position;
    if (!g.index) g.setIndex([...Array(pos.count).keys()]);
    const idx = g.index.array, keep = [];
    for (let i = 0; i < idx.length; i += 3) {
      a.fromBufferAttribute(pos, idx[i]).applyMatrix4(o.matrixWorld);
      b.fromBufferAttribute(pos, idx[i + 1]).applyMatrix4(o.matrixWorld);
      c.fromBufferAttribute(pos, idx[i + 2]).applyMatrix4(o.matrixWorld);
      const m = a.add(b).add(c).divideScalar(3);
      if (!boxes.some(bx => bx.containsPoint(m))) keep.push(idx[i], idx[i + 1], idx[i + 2]);
    }
    g.setIndex(keep);
  });
}
function solidify(root) {
  root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.transparent = false; m.alphaTest = 0.5; m.depthWrite = true; }); } });
  return root;
}

// ─── bench ───
add(new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.04, 1.14, 2, 0.008), M.terrazzo), 0, BENCH - 0.02, -0.42);
staticBox(0.85, 0.02, 0.57, 0, BENCH - 0.02, -0.42);
add(new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.86, 0.025), M.oakFront), 0, BENCH - 0.47, 0.14);
world.createCollider(RAPIER.ColliderDesc.cuboid(5, 0.05, 5).setTranslation(0, -0.05, 0));
add(new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.3, 0.02), M.oakFront), 0, BENCH + 0.15, -1.0);

// ─── espresso machine (model): baked portafilters cut out, colliders from measurements ───
{
  const m = gMachine.scene;
  cullTriangles(m, [
    new THREE.Box3(new V3(-0.215, 0.235, 0.12), new V3(-0.085, 0.334, 0.44)),   // portafilter locked in the left group
    new THREE.Box3(new V3(0.06, 0.134, 0.11), new V3(0.38, 0.22, 0.33)),        // portafilter lying on the tray
    new THREE.Box3(new V3(0.30, 0.135, 0.10), new V3(0.43, 0.343, 0.27)),       // right steam wand: replaced by ours
  ]);
  solidify(m); m.position.copy(M_OFF); scene.add(m);
  staticBoxSpan(-0.47, 0.47, BENCH, TRAY_TOP, mZ(-0.288), MACHINE_FRONT);            // base + drip tray
  staticBoxSpan(-0.47, 0.47, mY(0.344), mY(0.558), mZ(-0.288), MACHINE_FRONT);       // upper body
  staticBoxSpan(-0.47, 0.47, TRAY_TOP, mY(0.344), mZ(-0.288), RECESS_BACK);          // back of the brew recess
  for (const sx of [-1, 1]) staticCyl(0.045, 0.012, sx * 0.15, GROUP_BOTTOM + 0.006, GH.z);
}
// cups warming on top
const LATHE_CUP = [[0, 0], [0.027, 0], [0.030, 0.004], [0.033, 0.02], [0.037, 0.045], [0.040, 0.068], [0.0415, 0.08], [0.0385, 0.08], [0.0385, 0.078], [0.036, 0.05], [0.031, 0.02], [0.028, 0.008], [0, 0.008]];
for (let i = 0; i < 6; i++) { const c = lathe(LATHE_CUP, M.ceramic); c.rotation.x = Math.PI; c.position.set(-0.3 + i * 0.12, mY(0.528) + 0.08, mZ(0.12 - (i % 2) * 0.13)); scene.add(c); }

// grinder (procedural), knock box, tamper, pitcher, takeaway cups
const grinder = new THREE.Group(); grinder.position.copy(GRINDER); scene.add(grinder);
add(new THREE.Mesh(new RoundedBoxGeometry(0.16, 0.42, 0.22, 3, 0.02), M.matte), 0, 0.21, 0, grinder);
add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.035, 0.03, 24), M.brushed), 0, 0.435, 0, grinder);
add(lathe([[0.035, 0], [0.07, 0.16], [0.075, 0.17], [0.0, 0.17]], M.glass), 0, 0.45, 0, grinder);
add(lathe([[0, 0], [0.034, 0], [0.065, 0.12], [0, 0.12]], M.beans), 0, 0.453, 0, grinder);
add(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.035, 0.07), M.brushed), 0, CHUTE_Y - BENCH + 0.0175, 0.135, grinder);   // chute
for (const sx of [-1, 1]) grinder.add(rodMesh(new V3(sx * 0.03, 0.18, 0.11), new V3(sx * 0.03, 0.18, 0.2), 0.004, M.brushed));   // fork
add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.04, 0.04), M.brushed), 0, 0.15, 0.13, grinder).visible = false;
staticBox(0.08, 0.21, 0.11, GRINDER.x, BENCH + 0.21, GRINDER.z);
const grindStream = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.01, 1, 10), new THREE.MeshStandardMaterial({ color: 0x4a2c1a, roughness: 1 }));
grindStream.visible = false; scene.add(grindStream);

  stepGrains(dt);   // in the fixed step, so the dose doesn't depend on frame rate
  milkChain(dt);

  if (S.respawnT > 0) { S.respawnT -= dt; if (S.respawnT <= 0) placeCup(); return; }
  const cupHeld = S.held?.name === 'cup';

  const cp = v3(cupBody.translation()), cq = q4(cupBody.rotation());
  const cupUp = UP.clone().applyQuaternion(cq), top = cp.clone().addScaledVector(cupUp, CUP_H / 2);
  const cv = v3(cupBody.linvel());
  const acc = cv.clone().sub(S.prevV).divideScalar(dt);
  const dv = cv.distanceTo(S.prevV); S.prevV.copy(cv);
  S.aSm += (Math.hypot(acc.x, acc.z) - S.aSm) * Math.min(1, dt * 10);
  const tilt = THREE.MathUtils.radToDeg(cupUp.angleTo(UP));
  S.clinkCd -= dt;
  if (!cupHeld && dv > 0.3 && S.clinkCd <= 0) { clink(Math.min(1, dv / 1.5)); S.clinkCd = 0.09; }

  // spill: the liquid surface tilts with the cup and with how hard you accelerate it
  const level = cupLevel();
  if (level > 0.01) {
    const eff = tilt + THREE.MathUtils.radToDeg(Math.atan(S.aSm / 9.81)) * P.slosh;
    const thresh = 10 + (1 - Math.min(1, level)) * 55;
    if (eff > thresh) {
      const loss = Math.min(level, (eff - thresh) / 30 * dt * P.spillRate), keep = 1 - loss / level;
      S.fill *= keep; S.cupMilk *= keep; S.spillAcc += loss * 300;
      const lipDir = new V3(cupUp.x, 0, cupUp.z);
      if (lipDir.lengthSq() < 1e-4) lipDir.set(-acc.x, 0, -acc.z);
      lipDir.normalize();
      while (S.spillAcc > 1) {
        S.spillAcc -= 1;
        spawnDrop(top.clone().addScaledVector(lipDir, CUP_R), cv.clone().addScaledVector(lipDir, 0.25 + Math.random() * 0.2).add(new V3((Math.random() - .5) * .1, 0.05, (Math.random() - .5) * .1)));
      }
      if (loss > 0.002 && S.clinkCd <= 0) { noise(0.25, 900, 0.8, 0.05); S.clinkCd = 0.25; }
    }
  }

  const resting = !cupHeld && cv.length() < 0.05 && v3(cupBody.angvel()).length() < 0.6;
  const bottomY = cp.y - CUP_H / 2;
  const elapsed = S.time - S.roundStart;

  if (cp.y < BENCH - 0.06 || (tilt > 60 && !cupHeld)) {
    S.failT += dt;
    if (S.failT > (cp.y < BENCH - 0.06 ? 0.3 : 0.9)) {
      S.failT = 0; noise(0.4, 2500, 0.5, 0.12, 'highpass'); clink(0.8);
      for (let i = 0; i < Math.round(cupLevel() * 40); i++) spawnDrop(top, new V3((Math.random() - .5) * .8, Math.random() * .6, (Math.random() - .5) * .8));
      freshCup(cp.y < BENCH - 0.06 ? 'Smash.' : 'Knocked it.');
      return;
    }
  } else S.failT = 0;

  if (S.phase === 'toMachine') {
    const inZone = Math.hypot(cp.x - GH.x, cp.z - GH.z) < P.trayTolerance && Math.abs(bottomY - TRAY_TOP) < 0.012 && tilt < 10;
    S.restT = inZone && resting ? S.restT + dt : 0;
    const once = S.restT > 0.35 && S.restT - dt <= 0.35;
    if (S.restT > 0.35 && S.pfAt !== 'group') { if (once) toast('No portafilter in the group', 1.2); }
    else if (S.restT > 0.35 && S.puck) { if (once) toast('That’s the last puck<small>knock it out and grind fresh</small>', 1.6); }
    else if (S.restT > 0.35 && S.dose < 0.25) { if (once) toast('Nothing in the basket<small>grind first</small>', 1.4); }
    else if (S.restT > 0.35) {
      S.shotQ = shotQuality();
      M.crema.color.set(S.dose < 0.8 ? 0xc79a62 : S.dose > 1.15 ? 0x5e3518 : 0xa8652f);
      S.phase = 'filling'; S.shotT = 0; S.t1 = elapsed; S.restT = 0;
      shotNoise = noise(2.6, 380, 0.7, 0.06);
      toast(`Under the group · ${S.t1.toFixed(1)}s<small>${S.t1 < 5 ? 'under 5 — clean' : 'goal is under 5s'}</small>`, 1.6);
    }
  } else if (S.phase === 'filling') {
    S.shotT += dt;
    const flowing = S.pfAt === 'group';
    const inZone = Math.hypot(cp.x - GH.x, cp.z - GH.z) < P.trayTolerance + 0.01 && tilt < 25;
    if (flowing && inZone) S.fill = Math.min(1, S.fill + dt / 2.4);
    stream.visible = flowing;
    const yTop = PF_LOCK.y - 0.035, yBot = inZone ? bottomY + 0.018 + 0.038 * cupLevel() : TRAY_TOP;
    stream.position.set(GH.x, (yTop + yBot) / 2, GH.z); stream.scale.y = Math.max(0.001, yTop - yBot);
    if (S.shotT >= 2.4) {
      stream.visible = false; S.phase = 'toPass'; S.puck = true;
      if (S.fill > 0.3) toast('Shot’s in<small>now steam the milk and pour</small>', 1.8);
      else toast('Most of that went in the tray', 1.6);
    }
  } else if (S.phase === 'toPass') {
    const inZone = Math.hypot(cp.x - PASS.x, cp.z - PASS.z) < 0.08 && Math.abs(bottomY - PASS_TOP) < 0.012 && tilt < 10;
    S.restT = inZone && resting ? S.restT + dt : 0;
    if (S.restT > 0.35) {
      const t2 = elapsed, f = S.fill, lvl = cupLevel(), T = S.cupMilkTemp, F = S.cupFoam;
      const noMilk = S.cupMilk < 40;
      const milkQ = noMilk ? 0.35 : S.cupScalded ? 0.25 : T >= 55 && T <= 66 ? 1 : T < 45 ? 0.5 : 0.8;
      const foamQ = noMilk ? 1 : F >= 0.12 && F <= 0.4 ? 1 : F > 0.4 ? 0.65 : 0.8;
      const fillQ = Math.min(1, lvl / 0.9);
      const q = f < 0.3 ? 0.05 : S.shotQ * milkQ * foamQ * fillQ;
      const note = f < 0.3 ? 'Where’s the coffee?' : noMilk ? 'Dave wanted milk in that.' : S.cupScalded ? 'Scalded milk.' : T < 45 ? 'Lukewarm.' : S.shotQ < 0.75 ? S.shotNote : F > 0.4 ? 'Too foamy. That’s a cappuccino.' : F < 0.12 ? 'Flat milk. Stretch it a bit.' : T > 66 ? 'Hot milk, a bit scorched.' : lvl < 0.8 ? 'Bit short.' : S.shotNote;
      const verdict = q >= 0.9 ? 'Perfect. Dave nods.' : q >= 0.7 ? `Close. ${note}` : `Dave sips. ${note}`;
      S.runs.unshift({ t1: S.t1, t2, f, q }); S.runs.length = Math.min(S.runs.length, 6);
      toast(`${verdict}<small>${t2.toFixed(1)}s · ${Math.round(q * 100)}% score</small>`, 2.6);
      clink(0.5);
      S.phase = 'done'; S.resultT = 2.4;
    }
  } else if (S.phase === 'done') {
    S.resultT -= dt;
    if (S.resultT <= 0) { freshCup(); S.roundStart = S.time; S.t1 = null; }
  }
}

// ─── render ───
function stepsHtml(prepDone) {
  const st = (done, txt, warn) => `<div class="step ${done ? 'done' : ''} ${warn ? 'warn' : ''}">${done ? '✓' : '▢'} ${txt}</div>`;
  const g = (S.dose * DOSE_G).toFixed(1);
  return (S.puck && !prepDone ? st(false, 'knock out the old puck', true) : '')
    + st(prepDone || (S.dose >= 0.8 && !S.puck), `grind · ${S.puck && !prepDone ? '0.0' : g}g of 18.5`, S.dose > 1.15 && !S.puck)
    + st(prepDone || (S.tamp >= 1 && !S.puck), 'tamp')
    + st(prepDone || (S.pfAt === 'group' && S.dose > 0.25 && !S.puck), 'lock it in');
}
function milkStepsHtml(served) {
  const st = (done, txt, warn) => `<div class="step ${done ? 'done' : ''} ${warn ? 'warn' : ''}">${done ? '✓' : '▢'} ${txt}</div>`;
  const poured = S.cupMilk > 60;
  return st(served || poured || (S.jug.temp >= 55 && S.jug.ml >= 100 && !S.jug.scalded), `steam milk · ${served || poured ? 'done' : milkWord()}`, S.jug.scalded || S.jug.temp > 66)
    + st(served || poured, `pour${S.cupMilk > 1 && !served ? ` · ${Math.round(cupLevel() * 100)}% full` : ''}`);
}
function renderFrame(dt) {
  const pp = palmBody.translation(), pq = palmBody.rotation();
  hand.position.set(pp.x, pp.y, pp.z); hand.quaternion.set(pq.x, pq.y, pq.z, pq.w); hand.updateMatrixWorld(true);
  const cp = cupBody.translation(), cq = cupBody.rotation();
  cup.position.set(cp.x, cp.y, cp.z); cup.quaternion.set(cq.x, cq.y, cq.z, cq.w);
  const fp = pfBody.translation(), fq = pfBody.rotation();
  pf.position.set(fp.x, fp.y, fp.z); pf.quaternion.set(fq.x, fq.y, fq.z, fq.w);
  const tp = tamperBody.translation(), tq = tamperBody.rotation();
  tamper.position.set(tp.x, tp.y, tp.z); tamper.quaternion.set(tq.x, tq.y, tq.z, tq.w);
  const jp = jugBody.translation(), jq = jugBody.rotation();
  jug.position.set(jp.x, jp.y, jp.z); jug.quaternion.set(jq.x, jq.y, jq.z, jq.w);
  jugMilk.visible = S.jug.ml > 5; jugMilk.position.y = jugSurfaceH();
  jugMilk.quaternion.copy(jug.quaternion).invert().multiply(FLAT_Q);   // the milk stays level when the jug tips
  M_MILK.color.set(S.jug.scalded ? 0xe9dcc4 : 0xf4f1ea).lerp(new THREE.Color(0xfffdf8), S.jug.foam); M_MILK.roughness = 0.3 + 0.5 * S.jug.foam;
  const bp = bottleBody.translation(), bq = bottleBody.rotation();
  bottle.position.set(bp.x, bp.y, bp.z); bottle.quaternion.set(bq.x, bq.y, bq.z, bq.w); bottle.visible = S.bottleGoneT <= 0;
  // too hot to hold: the hand (and the jug in it) starts to shake
  if (S.held?.name === 'jug' && S.jug.temp > 62) {
    const a = Math.min(1, (S.jug.temp - 62) / 8) * 0.004, j = new V3((Math.random() - 0.5) * a * 2, (Math.random() - 0.5) * a, (Math.random() - 0.5) * a * 2);
    hand.position.add(j); hand.updateMatrixWorld(true); jug.position.add(j);
  }
  mound.visible = S.dose > 0.02; mound.material = S.puck ? M_PUCK : M_GROUNDS;
  mound.scale.set(Math.min(1, 0.55 + S.dose * 0.5), moundScale(), Math.min(1, 0.55 + S.dose * 0.5));
  updateLiquid(cupLevel());
  if (S.cupMilk > 15) { liquidTop.material = S.art ? heartMat : M_LATTE; M_LATTE.color.copy(M.crema.color).lerp(new THREE.Color(0xe8d6bd), Math.min(1, S.cupMilk / (S.cupMilk + SHOT_ML * S.fill + 1))); }
  else liquidTop.material = M.crema;

  poseArm();
  rigs.forEach((rig, i) => {
    // holding a cup, fingers hook the rim rather than closing into a fist inside it
    const c = S.curl[i] * (S.held?.name === 'cup' && i < 4 ? 0.55 : 1), ranges = i === 4 ? CURL.thumb : CURL.finger;
    rig.forEach((j, k) => { const [o, s] = ranges[k]; j.b.quaternion.copy(j.rest).multiply(_q.setFromAxisAngle(j.ax, o + (s - o) * c)); });
  });

  stepDrops(dt); updateCues();

  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $toast.style.opacity = 0; }
  const el = S.time - S.roundStart;
  const done1 = S.phase !== 'toMachine', done2 = S.phase === 'done';
  const practice = practiceStart ? Math.floor((performance.now() - practiceStart) / 1000) : 0;
  $docket.innerHTML = `<h1>Flat white</h1><div class="who">Table 4 · Dave · ceramic</div>
    ${stepsHtml(done1)}
    <div class="step ${done1 ? 'done' : ''}">${done1 ? '✓' : '▢'} cup under the group${S.t1 != null ? ` · ${S.t1.toFixed(1)}s` : ''}</div>
    ${milkStepsHtml(done2)}
    <div class="step ${done2 ? 'done' : ''}">${done2 ? '✓' : '▢'} to the pass</div>
    <div class="clock">${S.phase === 'done' ? '' : el.toFixed(1) + 's'}</div>
    <div class="runs">practice ${Math.floor(practice / 60)}:${String(practice % 60).padStart(2, '0')} · milk ${(S.bottleMl / 1000).toFixed(1)}L left${S.milkWasted > 5 ? ` · ${Math.round(S.milkWasted)}ml wasted` : ''}<br>
    ${S.runs.map(r => `<b>${r.t2.toFixed(1)}s</b> · ${Math.round((r.q ?? r.f) * 100)}% score`).join('<br>') || 'no orders yet'}</div>`;
  $fingers.querySelectorAll('.f').forEach(n => {
    const i = +n.dataset.i;
    const on = P.mode === 'grip' ? S.grade !== 'none' : S.onObj[i];
    n.classList.toggle('curl', S.curl[i] > 0.5); n.classList.toggle('on', on && S.curl[i] > 0.5);
  });
  $grip.textContent = S.held ? `${S.grade === 'firm' ? 'holding' : 'pinching — wobbly'} the ${S.held.name}` : '';
}

// ─── tuning panel ───
const gui = new GUI({ title: 'Hand feel' });
gui.add(P, 'mode', ['easy', 'fingers', 'grip']).onChange(() => { save(); buildFingerHud(); });
const fa = gui.addFolder('Arm');
fa.add(P, 'spring', 20, 400, 1); fa.add(P, 'damping', 2, 50, 0.5); fa.add(P, 'maxSpeed', 0.5, 6, 0.1);
const fw = gui.addFolder('Wrist');
fw.add(P, 'wristFollow', 2, 40, 0.5); fw.add(P, 'rollSpeed', 0.5, 6, 0.1);
const fh = gui.addFolder('Height');
fh.add(P, 'hover', 0.12, 0.45, 0.005); fh.add(P, 'lowerOffset', 0.06, 0.16, 0.001); fh.add(P, 'carryLift', 0, 0.04, 0.001);
const ff = gui.addFolder('Fingers');
ff.add(P, 'curlSpeed', 2, 30, 0.5); ff.add(P, 'grabRadius', 0.01, 0.07, 0.001);
const fc = gui.addFolder('Coffee');
fc.add(P, 'spillRate', 0, 4, 0.05); fc.add(P, 'slosh', 0, 3, 0.05); fc.add(P, 'trayTolerance', 0.01, 0.07, 0.001);
const fr = gui.addFolder('Room');
fr.add(P, 'bgBlur', 0, 1, 0.01).onChange(applyBg); fr.add(P, 'bgIntensity', 0, 2, 0.01).onChange(applyBg); fr.add(P, 'bgTurn', 0, Math.PI * 2, 0.01).onChange(applyBg);
gui.onChange(save);
gui.add({ copy() { navigator.clipboard?.writeText(JSON.stringify(P, null, 2)); toast('Settings copied', 1); } }, 'copy').name('Copy settings');
gui.add({ reset() { Object.assign(P, DEFAULTS); save(); applyBg(); gui.controllersRecursive().forEach(c => c.updateDisplay()); buildFingerHud(); } }, 'reset').name('Reset defaults');
[fa, fw, fh, ff, fc, fr].forEach(f => f.close());
if (innerWidth < 760) gui.close();

// sim(ms) steps the world synchronously, so scripted playtests don't depend on frame rate or tab visibility
const sim = ms => { for (let i = 0, n = Math.round(ms / 1000 / STEP); i < n; i++) step(STEP); renderFrame(0); renderer.render(scene, camera); };
window.toy = { getReachObj: () => reachObj?.name, S, P, keys, target, aimScreen: (x, y) => { ndc.set(x, y); hasPointer = true; }, noPointer: () => (hasPointer = false), setLowered: b => (lowered = b), setMouse: b => (mouseHeld = b), setTilt: v => { tilting = v !== null; tiltTarget = v || 0; }, palmBody, cupBody, pfBody, tamperBody, jugBody, bottleBody, WAND_TIP, cupLevel, THREE, sim, FORK_POSE, KNOCK, GRABS, gripPoint, camera, scene, applyBg, rigs, GH, PF_LOCK, PF_GRIP, TRAY_TOP, PASS, fit };

let last = performance.now(), accT = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
  accT += dt;
  while (accT >= STEP) { step(STEP); accT -= STEP; }
  renderFrame(dt);
  renderer.render(scene, camera);
});
toast('Dave wants a flat white<small>cup’s on your right</small>', 2.5);
</script>
</body>
</html>
