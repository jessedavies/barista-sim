<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Measure</title>
<style>body{margin:0;background:#222} canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body>
<script type="module">
// measure.html?m=<folder>&s=<scale> : front / side / top orthographic views with a 5cm grid (1cm minor), origin cross in red.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search), name = q.get('m'), s = +(q.get('s') || 1);
const V = +(q.get('v') || 390), focus = q.get('f') ? q.get('f').split(',').map(Number) : null, zoomExt = +(q.get('e') || 0);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1);
renderer.setSize(V * 3, V); renderer.setScissorTest(true); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2b2b);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const g = await new GLTFLoader().loadAsync(`../assets/sketchfab/${name}/scene.gltf`);
g.scene.scale.setScalar(s); scene.add(g.scene); g.scene.updateMatrixWorld(true);
g.scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.transparent = false; m.alphaTest = 0.5; m.depthWrite = true; }); });
const box = new THREE.Box3().setFromObject(g.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
const ext = zoomExt || Math.max(size.x, size.y, size.z) * 0.6;
if (focus) c.set(...focus);
function grid(plane) {
  const grp = new THREE.Group(), n = Math.ceil(ext / 0.01) + 2;
  for (let i = -n; i <= n; i++) {
    const major = i % 5 === 0, col = major ? 0x6a8caf : 0x3a3f46;
    const m = new THREE.LineBasicMaterial({ color: i === 0 ? 0xff4040 : col, transparent: true, opacity: major ? 0.9 : 0.4 });
    const L = n * 0.01;
    const a = [new THREE.Vector3(i * 0.01, -L, 0), new THREE.Vector3(i * 0.01, L, 0)], b = [new THREE.Vector3(-L, i * 0.01, 0), new THREE.Vector3(L, i * 0.01, 0)];
    grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a), m), new THREE.Line(new THREE.BufferGeometry().setFromPoints(b), m));
  }
  
  if (plane === 'side') grp.rotation.y = Math.PI / 2;
  if (plane === 'top') grp.rotation.x = -Math.PI / 2;
  return grp;
}
const views = [['front', new THREE.Vector3(0, 0, 10)], ['side', new THREE.Vector3(10, 0, 0)], ['top', new THREE.Vector3(0, 10, 0.0001)]];
views.forEach(([nm, dir], i) => {
  const gr = grid(nm); scene.add(gr);
  const cam = new THREE.OrthographicCamera(-ext, ext, ext, -ext, 0.001, 100);
  cam.position.copy(c).add(dir); cam.lookAt(c);
  if (nm === 'front') { gr.position.set(0, 0, box.min.z - 0.01); }
  if (nm === 'side') { gr.position.set(box.min.x - 0.01, 0, 0); }
  if (nm === 'top') { gr.position.set(0, box.min.y - 0.01, 0); }
  renderer.setViewport(i * V, 0, V, V); renderer.setScissor(i * V, 0, V, V); renderer.render(scene, cam);
  scene.remove(gr);
});
const bones = []; g.scene.traverse(o => { if (o.isBone) { const p = o.getWorldPosition(new THREE.Vector3()); bones.push(`${o.name} <- ${o.parent?.name} @ ${p.toArray().map(v => v.toFixed(3)).join(',')}`); } });
const rc = new THREE.Raycaster();
window.ray = (o, d) => { rc.set(new THREE.Vector3(...o), new THREE.Vector3(...d).normalize()); const h = rc.intersectObject(g.scene, true)[0]; return h ? h.point.toArray().map(v => +v.toFixed(3)) : null; };
// depth map: rays from the front (+z) toward -z on a grid; returns rows of hit z (cm) per x
window.depthMap = (x0, x1, y0, y1, st) => { const rows = []; for (let y = y1; y >= y0 - 1e-6; y -= st) { const r = []; for (let x = x0; x <= x1 + 1e-6; x += st) { const h = window.ray([x, y, 2], [0, 0, -1]); r.push(h ? Math.round(h[2] * 100) : '..'); } rows.push(y.toFixed(2) + ' ' + r.map(v => String(v).padStart(3)).join('')); } return rows.join('\n'); };
window.heightMap = (x0, x1, z0, z1, st) => { const rows = []; for (let z = z1; z >= z0 - 1e-6; z -= st) { const r = []; for (let x = x0; x <= x1 + 1e-6; x += st) { const h = window.ray([x, 3, z], [0, -1, 0]); r.push(h ? Math.round(h[1] * 100) : '..'); } rows.push(z.toFixed(2) + ' ' + r.map(v => String(v).padStart(3)).join('')); } return rows.join('\n'); };
const meshes = []; g.scene.traverse(o => { if (o.isMesh) { const b = new THREE.Box3().setFromObject(o); meshes.push(`${o.name} min ${b.min.toArray().map(v => v.toFixed(3))} max ${b.max.toArray().map(v => v.toFixed(3))} mat ${o.material.name} col #${o.material.color?.getHexString()} map ${!!o.material.map} rough ${o.material.roughness?.toFixed(2)} metal ${o.material.metalness?.toFixed(2)}`); } });
window.info = { meshes, size: size.toArray(), centre: c.toArray(), min: box.min.toArray(), max: box.max.toArray(), ext, bones };
document.title = 'done';
</script></body></html>
