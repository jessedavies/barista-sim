<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Model Inspector</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px ui-monospace,monospace} canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Loads every model in assets/sketchfab, reports size, parts, materials and rig, and renders a contact sheet.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const NAMES = ['canarian_cafe_-_coffee_machine', 'coffee_tamper', 'cup_of_coffee', 'first_person_hands_rigged', 'paper_coffee_cup_3d_pack', 'umamusume_milk_frothing_pitcher'];
const W = 360, H = 270, COLS = 3;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W * COLS, H * Math.ceil(NAMES.length / COLS)); renderer.setScissorTest(true);
renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const report = {};
const loader = new GLTFLoader();
for (const [i, name] of NAMES.entries()) {
  const g = await loader.loadAsync(`../assets/sketchfab/${name}/scene.gltf`);
  const root = g.scene; root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const meshes = [], mats = new Set(), bones = [];
  root.traverse(o => { if (o.isMesh) { meshes.push(`${o.name}${o.isSkinnedMesh ? ' (skinned)' : ''} [${o.geometry.attributes.position.count}v]`); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.add(`${m.name}${m.map ? ' +map' : ''}${m.transparent ? ' transp' : ''}`)); } if (o.isBone) bones.push(o.name); });
  const top = []; (function walk(o, d) { if (d > 3) return; top.push('  '.repeat(d) + (o.name || o.type)); o.children.forEach(c => walk(c, d + 1)); })(root, 0);
  report[name] = { size: size.toArray().map(v => +v.toFixed(4)), centre: ctr.toArray().map(v => +v.toFixed(4)), min: box.min.toArray().map(v => +v.toFixed(4)), meshes: meshes.slice(0, 40), meshCount: meshes.length, materials: [...mats], bones, animations: g.animations.map(a => a.name), tree: top.slice(0, 60) };
  const scene = new THREE.Scene(); scene.environment = env; scene.background = new THREE.Color(0x333333); scene.add(root);
  const r = size.length() / 2, cam = new THREE.PerspectiveCamera(35, W / H, r / 100, r * 100);
  cam.position.copy(ctr).add(new THREE.Vector3(0.9, 0.6, 1.2).normalize().multiplyScalar(r * 3)); cam.lookAt(ctr);
  const x = (i % COLS) * W, y = renderer.domElement.height / renderer.getPixelRatio() - (Math.floor(i / COLS) + 1) * H;
  renderer.setViewport(x, y, W, H); renderer.setScissor(x, y, W, H); renderer.render(scene, cam);
}
window.report = report; document.title = 'done';
</script></body></html>
